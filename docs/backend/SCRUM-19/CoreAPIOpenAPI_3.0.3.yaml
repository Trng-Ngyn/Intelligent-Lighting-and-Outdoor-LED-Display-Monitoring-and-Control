openapi: 3.0.3
info:
  title: Intelligent Lighting and Outdoor LED Display Monitoring and Control - Core API
  version: 1.0.0
  description: |
    Đặc tả Core REST API phục vụ Web Dashboard và nghiệp vụ quản lý hệ thống
    chiếu sáng thông minh, màn hình LED, điều khiển thiết bị, telemetry,
    xác thực JWT/RBAC và workflow nội dung LED.

    Phạm vi được tổng hợp từ nhiệm vụ W5-BE, thiết kế SCRUM-19, mã nguồn
    core_api.py/mock_cloud_service.py, giao thức MQTT5, command schemas và
    migration TimescaleDB đã cung cấp. Các endpoint REST là hợp đồng API
    đề xuất cho triển khai học thuật; cần nhóm xác nhận trước khi tích hợp.

    RBAC baseline trong bản này được rút gọn thành 4 role theo W5: ADMIN,
    OPERATOR, CONTENT_AUTHOR, CONTENT_APPROVER. OPERATOR được giả định có
    quyền vận hành thiết bị và publish theo permission; AUDITOR độc lập trong
    thiết kế W4 chưa được tách thành role riêng trong baseline này. Cần xác
    nhận mapping này với Team Leader trước khi triển khai.
servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.example.com
    description: Example deployment URL; replace before deployment
tags:
  - name: Authentication
  - name: Assets
  - name: Lighting Controls
  - name: Analytics
  - name: LED Content
  - name: Approval
  - name: Publication
  - name: Administration
  - name: Audit
security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Đăng nhập và nhận JWT access/refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Cấp access token mới bằng refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token mới
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Thu hồi refresh token hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Đã đăng xuất và thu hồi refresh token
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Lấy thông tin người dùng từ access token
      responses:
        '200':
          description: Thông tin người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: Liệt kê tài sản trong phạm vi tenant/site được phép
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
        - name: kind
          in: query
          schema:
            type: string
            enum: [lighting, led, gateway]
        - name: status
          in: query
          schema:
            type: string
            enum: [online, offline, degraded, unknown]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách tài sản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/assets/{assetId}:
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Xem chi tiết một tài sản
      parameters:
        - $ref: '#/components/parameters/AssetId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Chi tiết tài sản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/controls/lighting/dim:
    post:
      tags: [Lighting Controls]
      operationId: setLightingDimming
      summary: Gửi lệnh điều chỉnh độ sáng đèn
      description: |
        API kiểm tra quyền điều khiển, phạm vi tenant/site, trạng thái tài sản
        và giới hạn brightness 0-100 trước khi tạo command.request.v1 và publish
        MQTT 5 QoS 1. HTTP 202 chỉ xác nhận backend đã tiếp nhận/xử lý yêu cầu;
        không đồng nghĩa thiết bị đã thực thi. Kết quả thiết bị được cập nhật
        bất đồng bộ qua command.result.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightingDimRequest'
      responses:
        '202':
          description: Đã tiếp nhận lệnh; chờ kết quả từ thiết bị
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandSubmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: MQTT broker chưa sẵn sàng hoặc publish thất bại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/controls/lighting/commands/{commandId}:
    get:
      tags: [Lighting Controls]
      operationId: getLightingCommand
      summary: Tra cứu trạng thái và kết quả lệnh điều khiển
      parameters:
        - $ref: '#/components/parameters/CommandId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Trạng thái lệnh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/analytics/telemetry/realtime:
    get:
      tags: [Analytics]
      operationId: getRealtimeTelemetry
      summary: Lấy telemetry mới nhất của tài sản
      description: Dữ liệu mới nhất được tiếp nhận và lưu trong TimescaleDB.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
        - name: assetId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [lighting, led]
      responses:
        '200':
          description: Telemetry mới nhất
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/analytics/telemetry/history:
    get:
      tags: [Analytics]
      operationId: getTelemetryHistory
      summary: Truy vấn lịch sử telemetry và phụ tải
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
        - name: assetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: interval
          in: query
          required: false
          description: Độ phân giải tổng hợp; phụ thuộc dữ liệu và continuous aggregate.
          schema:
            type: string
            enum: [raw, hourly, daily, monthly]
            default: raw
      responses:
        '200':
          description: Chuỗi dữ liệu lịch sử
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelemetryHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/content:
    post:
      tags: [LED Content]
      operationId: createContent
      summary: Tạo nội dung LED ở trạng thái drafted
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentCreate'
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    get:
      tags: [LED Content]
      operationId: listContent
      summary: Liệt kê nội dung trong phạm vi được cấp quyền
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ContentStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách nội dung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPage'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/content/{contentId}:
    parameters:
      - $ref: '#/components/parameters/ContentId'
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SiteId'
    get:
      tags: [LED Content]
      operationId: getContent
      summary: Xem chi tiết nội dung
      responses:
        '200':
          description: Chi tiết nội dung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [LED Content]
      operationId: updateContent
      summary: Cập nhật bản nháp; thay đổi quan trọng làm approval cũ mất hiệu lực
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentUpdate'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/content/{contentId}/validate:
    post:
      tags: [LED Content]
      operationId: validateContent
      summary: Kiểm tra file và metadata nội dung
      description: Kiểm tra codec, độ phân giải, kích thước, quyền nội dung, metadata và malware scan. Việc thực hiện các dịch vụ quét cần được tích hợp riêng.
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Kết quả kiểm tra
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/content/{contentId}/submit-approval:
    post:
      tags: [Approval]
      operationId: submitApproval
      summary: Gửi nội dung để phê duyệt
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 1000
      responses:
        '202':
          description: Đã tạo yêu cầu duyệt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/approvals/{approvalId}/decision:
    post:
      tags: [Approval]
      operationId: decideApproval
      summary: Phê duyệt hoặc từ chối; approver phải khác author
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Đã ghi nhận quyết định
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/content/{contentId}/publish:
    post:
      tags: [Publication]
      operationId: publishContent
      summary: Yêu cầu xuất bản nội dung đã được duyệt
      description: Kiểm tra approval, content hash, target, lịch, expiry và manifest trước khi phân phối.
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '202':
          description: Đã nhận yêu cầu phân phối
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/content/{contentId}/revoke:
    post:
      tags: [Publication]
      operationId: revokeContent
      summary: Thu hồi nội dung
      description: Player offline có thể chưa nhận lệnh cloud ngay; cần expiry/fallback cục bộ theo policy.
      parameters:
        - $ref: '#/components/parameters/ContentId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '202':
          description: Đã tiếp nhận yêu cầu thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/publications/{publicationId}:
    get:
      tags: [Publication]
      operationId: getPublication
      summary: Theo dõi trạng thái phân phối/xuất bản
      parameters:
        - $ref: '#/components/parameters/PublicationId'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Trạng thái xuất bản
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/roles:
    get:
      tags: [Administration]
      operationId: listRoles
      summary: Liệt kê bốn vai trò RBAC cơ sở và quyền
      responses:
        '200':
          description: Danh sách vai trò
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{userId}/roles:
    put:
      tags: [Administration]
      operationId: assignUserRoles
      summary: Gán vai trò cho người dùng trong tenant/site scope
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignment'
      responses:
        '200':
          description: Cập nhật vai trò
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Tra cứu nhật ký kiểm toán
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Danh sách audit event
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token do auth service cấp; MFA áp dụng cho tài khoản đặc quyền theo policy.
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: X-Site-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PublicationId:
      name: publicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc token không hợp lệ/hết hạn
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không đủ quyền hoặc ngoài tenant/site scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên trong phạm vi được phép
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Xung đột trạng thái, lệnh trùng hoặc approval hết hiệu lực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu không đạt kiểm tra schema hoặc nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
        mfa_code:
          type: string
          description: Mã MFA nếu policy yêu cầu.
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
