        result:
          $ref: '#/components/schemas/CommandResult'
        updated_at:
          type: string
          format: date-time

    CommandRequestEnvelope:
      type: object
      description: Payload MQTT command.request.v1; MQTT User Properties/signature được truyền ngoài JSON payload.
      additionalProperties: false
      required: [schema_version, message_type, tenant_id, site_id, command_id, actor, target, action, requested_value, policy_version, issued_at, expires_at, priority, approval_required, approval_ref]
      properties:
        schema_version:
          type: integer
          enum: [1]
        message_type:
          type: string
          enum: [command.request]
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        command_id:
          type: string
          format: uuid
        actor:
          type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [user, service]
            id:
              type: string
              format: uuid
        target:
          type: object
          additionalProperties: false
          required: [kind, id]
          properties:
            kind:
              type: string
              enum: [asset, group, zone]
            id:
              type: string
              format: uuid
        action:
          type: string
          enum: [set_power, set_dimming, set_brightness, apply_schedule, activate_manifest, revoke_manifest]
        requested_value:
          description: Giá trị phụ thuộc action; set_dimming/set_brightness nhận số 0-100.
          oneOf:
            - type: number
              minimum: 0
              maximum: 100
            - type: boolean
            - type: object
        policy_version:
          type: string
          minLength: 1
          maxLength: 80
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        priority:
          type: string
          enum: [schedule, operator, approved_override, emergency]
        approval_required:
          type: boolean
        approval_ref:
          type: string
          format: uuid
          nullable: true

    CommandResult:
      type: object
      description: Payload MQTT command.result.v1 do thiết bị/gateway phản hồi.
      additionalProperties: false
      required: [schema_version, message_type, tenant_id, site_id, result_id, command_id, asset_id, device_id, device_time, received_time, clock_quality, status, reason, observed_value, evidence_source]
      properties:
        schema_version:
          type: integer
          enum: [1]
        message_type:
          type: string
          enum: [command.result]
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        result_id:
          type: string
          format: uuid
        command_id:
          type: string
          format: uuid
        asset_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        device_time:
          type: string
          format: date-time
          nullable: true
        received_time:
          type: string
          format: date-time
        clock_quality:
          type: string
          enum: [synced, uncertain]
        status:
          type: string
          enum: [acknowledged, executed, verified, rejected, expired, failed, unknown]
        reason:
          type: string
          nullable: true
          maxLength: 512
        observed_value:
          type: object
          nullable: true
          description: Giá trị quan sát; null khi evidence_source là none. Các dạng hợp lệ gồm power, dimming_pct, brightness_pct, manifest_id hoặc schedule_id.
        evidence_source:
          type: string
          enum: [none, device_reported, player_reported, independent_sensor]

