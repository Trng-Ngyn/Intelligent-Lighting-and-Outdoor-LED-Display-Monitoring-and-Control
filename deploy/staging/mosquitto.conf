per_listener_settings true
persistence true
persistence_location /mosquitto/data/
autosave_interval 5
log_dest stdout
connection_messages true
max_queued_messages 200000
max_queued_bytes 268435456
message_size_limit 65536
listener 8883
plugin /usr/local/lib/pccom-retain.so
protocol mqtt
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /run/pki/ca.crt
certfile /run/pki/server.crt
keyfile /run/pki/server.key
acl_file /run/config/acl
tls_version tlsv1.2
