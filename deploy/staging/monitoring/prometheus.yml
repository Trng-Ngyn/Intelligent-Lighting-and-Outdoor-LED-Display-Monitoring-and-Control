global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: pccom-api
    static_configs:
      - targets: ["api:8000"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
