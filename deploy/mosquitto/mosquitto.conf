# Cấu hình Mosquitto 2.x cho kiểm thử cục bộ (KHÔNG dùng cho production).
# Chạy: docker compose up -d
# Kiểm tra: mosquitto_sub -h localhost -p 1883 -t '$SYS/broker/version' -C 1

listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type all

# MQTT 5 WebSocket cho frontend/tool nếu cần.
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
