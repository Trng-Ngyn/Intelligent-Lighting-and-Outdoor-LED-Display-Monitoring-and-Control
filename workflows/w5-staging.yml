name: W5 Firmware Backend Worker Frontend Staging
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-native-test.txt
      - name: Ruff runtime error checks
        run: ruff check src/ingestion src/staging_api src/backend tools/staging tests/w5 --select E9,F63,F7,F82
      - name: Native PostgreSQL integration tests
        env: {PYTHONPATH: "src:src/backend:."}
        run: python -m pytest tests/w5 -q -s
      - name: Existing team protocol and safety tests
        env: {PYTHONPATH: "src:src/backend:."}
        run: python -m unittest discover -s tests -p "test_*.py" -v
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-native-test.txt playwright==1.65.2
      - run: python -m playwright install --with-deps chromium
      - name: Browser to API to PostgreSQL smoke test
        env: {RUN_BROWSER: "1", PYTHONPATH: "src:src/backend:."}
        run: python -m pytest tests/w5/test_browser.py -q
  firmware:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {project: src/firmware_esp32, environment: esp32dev}
          - {project: src/firmware_esp32_idf, environment: esp32_dev}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install platformio==6.2.0
      - name: Compile actual ESP32 project
        run: pio run -d ${{ matrix.project }} -e ${{ matrix.environment }}
  docker-integration:
    runs-on: ubuntu-24.04
    needs: [python,frontend,firmware]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install jsonschema==4.25.1
      - name: Ephemeral test certificates and secrets
        run: python tools/staging/bootstrap.py --host localhost --demo
      - name: Build and start actual target stack
        run: |
          docker compose --env-file .staging/compose.env -f docker-compose.staging.yml up -d --build --wait --wait-timeout 300
          docker build -f src/ingestion/Dockerfile -t pccom-worker-standalone:ci .
      - name: mTLS, MQTT load, automatic CAGG and dimming integration
        run: docker compose --env-file .staging/compose.env -f docker-compose.staging.yml -f docker-compose.staging.test.yml run --rm verify
      - name: Collect non-secret logs
        if: always()
        run: bash tools/staging/evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: w5-staging-evidence, path: artifacts/, retention-days: 7}
      - name: Stop ephemeral CI environment
        if: always()
        run: docker compose --env-file .staging/compose.env -f docker-compose.staging.yml down --volumes
