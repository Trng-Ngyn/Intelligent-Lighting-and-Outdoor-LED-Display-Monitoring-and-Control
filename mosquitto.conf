per_listener_settings true
persistence false
retain_available true
max_packet_size 32768
message_size_limit 16384
log_dest stdout
connection_messages true

listener 8883
protocol mqtt
cafile /pki/device-ca.crt
certfile /pki/mqtt.crt
keyfile /pki/mqtt.key
crlfile /pki/device-ca.crl
tls_version tlsv1.3
require_certificate true
allow_anonymous false
use_identity_as_username true
use_username_as_clientid true
acl_file /mosquitto/config/acl.devices
plugin /usr/local/lib/pccom-retain.so

listener 8884
protocol mqtt
cafile /pki/service-ca.crt
certfile /pki/mqtt.crt
keyfile /pki/mqtt.key
tls_version tlsv1.3
require_certificate true
allow_anonymous false
use_identity_as_username true
use_username_as_clientid true
acl_file /mosquitto/config/acl.service
plugin /usr/local/lib/pccom-retain.so

# Field listener, reachable only inside the lab network.
listener 8885
protocol mqtt
cafile /pki/field-ca.crt
certfile /pki/mqtt.crt
keyfile /pki/mqtt.key
tls_version tlsv1.3
require_certificate true
allow_anonymous false
use_identity_as_username true
use_username_as_clientid true
acl_file /mosquitto/config/acl.southbound
plugin /usr/local/lib/pccom-retain.so
