worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/pccom-body;
    proxy_temp_path /tmp/pccom-proxy;
    fastcgi_temp_path /tmp/pccom-fastcgi;
    uwsgi_temp_path /tmp/pccom-uwsgi;
    scgi_temp_path /tmp/pccom-scgi;

    map "$ssl_client_verify:$ssl_client_serial" $registered_device {
        default "";
        include /pki/enrolled.map;
    }

    server {
        listen 8443 ssl;
        server_name edge-api.dev.pccom.test;
        ssl_certificate /pki/edge-api.crt;
        ssl_certificate_key /pki/edge-api.key;
        ssl_client_certificate /pki/device-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_crl /pki/device-ca.crl;
        ssl_protocols TLSv1.3;
        ssl_early_data off;
        ssl_session_cache off;
        ssl_session_tickets off;

        location = /v1/edge/health {
            if ($registered_device = "") { return 403; }
            default_type application/json;
            return 200 '{"status":"ok","device_id":"$registered_device"}';
        }

        location / { return 404; }
    }
}
