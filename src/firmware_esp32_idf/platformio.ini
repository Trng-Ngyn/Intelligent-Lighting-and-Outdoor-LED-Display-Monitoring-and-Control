; Firmware ESP32-WROOM-32 (ESP-IDF thật), thay thế dần bản Arduino trong
; src/firmware_esp32/. Chạy từ thư mục này: pio run -e esp32_dev

[platformio]
default_envs = esp32_dev
; ESP-IDF dùng thư mục main/, không phải src/ mặc định của PlatformIO.
src_dir = main

[env]
platform = espressif32@6.11.0 ; pins ESP-IDF 5.4.1 (có esp-mqtt MQTT 5)
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 921600

; Dev: KHÔNG bật flash encryption. Dùng cho S1/build kiểm chứng toolchain.
[env:esp32_dev]
board_build.esp-idf.sdkconfig_path = sdkconfig.dev
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults.common;sdkconfig.defaults.dev"
build_flags =
    -DPCCOM_PROFILE_DEV=1

; Secure: flash encryption + NVS encryption, key sinh TRÊN CHIP. Chỉ dùng trên
; 1 bo dự phòng và CHỈ flash sau khi được duyệt riêng. Không dùng board_build.encryption_key.
[env:esp32_secure]
board_build.esp-idf.sdkconfig_path = sdkconfig.secure
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults.common;sdkconfig.defaults.secure"
build_flags =
    -DPCCOM_PROFILE_SECURE=1
