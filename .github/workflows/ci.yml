name: Continuous Integration & Security Linting

on:
  push:
    branches: [main, develop, test/SCRUM-22-g1-protocol-rtm]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      ARTIFACT_NAME: pccom-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Record environment and source revision
        id: environment
        run: |
          python tools/run_ci_tests.py capture environment.txt python tools/run_ci_tests.py environment
          python tools/run_ci_tests.py capture environment.txt python -m pip --version
          python tools/run_ci_tests.py capture source_revision.txt git rev-parse HEAD

      - name: Install development dependencies
        id: install
        run: python tools/run_ci_tests.py capture provisioning.log python -m pip install -q -r requirements-dev.txt

      - name: Verify dependencies and format support
        id: dependencies
        run: |
          python tools/run_ci_tests.py capture dependencies.txt python -m pip list
          python tools/run_ci_tests.py capture dependency_check.txt python -m pip check
          python tools/run_ci_tests.py capture dependency_check.txt python tools/run_ci_tests.py preflight

      - name: JSON Syntax Check
        id: syntax
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python tools/run_ci_tests.py capture json_syntax_check.log python tools/run_ci_tests.py syntax

      - name: Run unittest discovery
        id: tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: python tools/run_ci_tests.py capture unittest.log python tools/run_ci_tests.py tests

      - name: Lint Backend, MQTT Protocol and Tools
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python tools/run_ci_tests.py capture flake8.log python -m flake8 src/iot_protocol src/edge_simulator src/backend tools tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Summarize execution
        if: ${{ always() }}
        shell: bash
        env:
          STEP_CHECKOUT: ${{ steps.checkout.outcome }}
          STEP_SETUP: ${{ steps.setup.outcome }}
          STEP_ENVIRONMENT: ${{ steps.environment.outcome }}
          STEP_INSTALL: ${{ steps.install.outcome }}
          STEP_DEPENDENCIES: ${{ steps.dependencies.outcome }}
          STEP_SYNTAX: ${{ steps.syntax.outcome }}
          STEP_TESTS: ${{ steps.tests.outcome }}
          STEP_LINT: ${{ steps.lint.outcome }}
        run: |
          if [[ "$STEP_SETUP" == success && "$STEP_CHECKOUT" == success ]]; then
            python tools/run_ci_tests.py summary
          else
            mkdir -p ci-evidence
            printf 'Checkout: %s\nSetup: %s\nTests: NOT RUN\n' "$STEP_CHECKOUT" "$STEP_SETUP" > ci-evidence/execution_summary.md
            cat ci-evidence/execution_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ci-evidence/
          retention-days: 14
          if-no-files-found: error
